        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        .page-root {
          min-height: 100vh;
          background: #0F1210;
          color: #F5F3EF;
          font-family: 'Inter', system-ui, -apple-system, sans-serif;
          -webkit-font-smoothing: antialiased;
        }

        .mentor-section {
          background: #0F1210;
          padding: 120px 24px 112px;
          position: relative;
          overflow: hidden;
        }

        /* subtle texture vignette */
        .mentor-section::before {
          content: "";
          position: absolute;
          inset: 0;
          background: radial-gradient(ellipse 80% 60% at 50% -10%, rgba(201,168,106,0.08), transparent 60%),
                      radial-gradient(ellipse 60% 40% at 90% 80%, rgba(201,168,106,0.05), transparent 70%);
          pointer-events: none;
        }

        .container {
          max-width: 1180px;
          margin: 0 auto;
          position: relative;
          z-index: 1;
        }

        /* HEADER */
        .header {
          text-align: center;
          margin-bottom: 84px;
        }

        .eyebrow {
          font-family: 'Inter', sans-serif;
          font-size: 12px;
          font-weight: 500;
          letter-spacing: 0.24em;
          text-transform: uppercase;
          color: #C9A86A;
          margin-bottom: 20px;
          display: block;
        }

        .title {
          font-family: 'Cormorant Garamond', Georgia, serif;
          font-size: 64px;
          font-weight: 500;
          line-height: 0.95;
          letter-spacing: -0.02em;
          color: #F5F3EF;
          margin-bottom: 28px;
        }

        .gold-line {
          width: 64px;
          height: 2px;
          background: #C9A86A;
          margin: 0 auto;
          border: 0;
        }

        /* MAIN GRID */
        .content-grid {
          display: grid;
          grid-template-columns: 440px 1fr;
          gap: 84px;
          align-items: start;
          margin-bottom: 96px;
        }

        /* PHOTO */
        .photo-wrap {
          position: relative;
          width: 100%;
        }

        .photo-glow {
          position: absolute;
          top: 20px;
          right: -20px;
          bottom: -20px;
          left: 20px;
          background: radial-gradient(ellipse at 50% 30%, rgba(201,168,106,0.25) 0%, rgba(201,168,106,0.08) 45%, transparent 75%);
          border: 1px solid rgba(201,168,106,0.2);
          border-radius: 16px;
          z-index: 1;
          pointer-events: none;
        }

        .mentor-foto {
          width: 100%;
          aspect-ratio: 4 / 5;
          object-fit: cover;
          border-radius: 16px;
          position: relative;
          z-index: 2;
          display: block;
          filter: saturate(0.9) contrast(1.05);
          box-shadow: 0 20px 60px rgba(0,0,0,0.45), 0 2px 10px rgba(0,0,0,0.3);
        }

        /* RIGHT CONTENT */
        .text-content {
          padding-top: 8px;
        }

        .mentor-name {
          font-family: 'Cormorant Garamond', Georgia, serif;
          font-size: 32px;
          font-weight: 600;
          line-height: 1.15;
          color: #F5F3EF;
          margin-bottom: 10px;
          letter-spacing: -0.01em;
        }

        .mentor-role {
          font-family: 'Inter', sans-serif;
          font-size: 13px;
          font-weight: 500;
          letter-spacing: 0.12em;
          text-transform: uppercase;
          color: #C9A86A;
          line-height: 1.5;
          margin-bottom: 32px;
        }

        .paragraphs {
          display: flex;
          flex-direction: column;
          gap: 20px;
          margin-bottom: 36px;
        }

        .paragraphs p {
          color: rgba(245,243,239,0.7);
          font-size: 16px;
          line-height: 1.8;
          font-weight: 300;
        }

        .quote {
          border-left: 2px solid #C9A86A;
          padding: 6px 0 6px 28px;
          margin-top: 8px;
        }

        .quote p {
          font-family: 'Cormorant Garamond', Georgia, serif;
          font-size: 22px;
          font-style: italic;
          line-height: 1.45;
          font-weight: 400;
          color: #F5F3EF;
          letter-spacing: -0.01em;
        }

        /* CARDS */
        .cards-grid {
          display: grid;
          grid-template-columns: repeat(3, 1fr);
          gap: 20px;
        }

        .card {
          background: rgba(255,255,255,0.03);
          border: 1px solid rgba(255,255,255,0.07);
          border-radius: 12px;
          padding: 32px 28px;
          transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
          position: relative;
          overflow: hidden;
        }

        .card::before {
          content: "";
          position: absolute;
          top: 0;
          left: 0;
          right: 0;
          height: 1px;
          background: linear-gradient(90deg, transparent, rgba(201,168,106,0.3), transparent);
          opacity: 0;
          transition: opacity 0.4s ease;
        }

        .card:hover {
          transform: translateY(-4px);
          background: rgba(255,255,255,0.045);
          border-color: rgba(201,168,106,0.18);
          box-shadow: 0 12px 40px rgba(0,0,0,0.3), 0 0 0 1px rgba(201,168,106,0.08) inset;
        }

        .card:hover::before {
          opacity: 1;
        }

        .card-label {
          font-family: 'Inter', sans-serif;
          font-size: 11px;
          font-weight: 600;
          letter-spacing: 0.18em;
          text-transform: uppercase;
          color: #C9A86A;
          margin-bottom: 14px;
          display: block;
        }

        .card-desc {
          font-family: 'Inter', sans-serif;
          font-size: 15px;
          font-weight: 300;
          line-height: 1.6;
          color: rgba(245,243,239,0.75);
        }

        /* RESPONSIVE */
        @media (max-width: 1024px) {
          .content-grid {
            grid-template-columns: 380px 1fr;
            gap: 56px;
          }
        }

        @media (max-width: 900px) {
          .mentor-section {
            padding: 72px 20px 80px;
          }
          .header {
            margin-bottom: 52px;
          }
          .title {
            font-size: 44px;
          }
          .content-grid {
            grid-template-columns: 1fr;
            gap: 48px;
            margin-bottom: 64px;
          }
          .photo-wrap {
            max-width: 480px;
            margin: 0 auto;
          }
          .photo-glow {
            top: 16px;
            right: -12px;
            bottom: -12px;
            left: 16px;
          }
          .mentor-name {
            font-size: 28px;
          }
          .cards-grid {
            grid-template-columns: 1fr;
            gap: 16px;
          }
          .quote p {
            font-size: 20px;
          }
        }

        @media (max-width: 480px) {
          .title {
            font-size: 38px;
          }
          .mentor-section {
            padding: 56px 18px 64px;
          }
          .card {
            padding: 26px 22px;
          }
